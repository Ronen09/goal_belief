[project]
name = "goalgeo"
version = "0.1.0"
description = "Goal-conditioned occupancy geometry in neural agents"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "torch", "matplotlib"]

[project.optional-dependencies]
llm = ["minigrid", "gymnasium", "transformers", "accelerate", "peft"]     # study 8; install with --no-deps to keep the system torch

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:amdsmi.*"]
